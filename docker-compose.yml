# Desarrollo local: Postgres expuesto solo en 127.0.0.1.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apunte
      POSTGRES_PASSWORD: apunte
      POSTGRES_DB: apunte
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apunte"]
      interval: 5s
      retries: 10
volumes:
  pg_data: {}
