name: deploy-qa
# Cada push a `develop`: pruebas → imagen en GHCR (etiqueta sha-<commit>) → despliegue automático en QA.
on:
  push:
    branches: [develop]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-qa
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v7
      - name: Desplegar en QA
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH=(ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          tar -C deploy -cz . | "${SSH[@]}" 'rm -rf /opt/apunte/deploy.new && mkdir -p /opt/apunte/deploy.new && tar -xz -C /opt/apunte/deploy.new && rm -rf /opt/apunte/deploy && mv /opt/apunte/deploy.new /opt/apunte/deploy'
          "${SSH[@]}" "/opt/apunte/deploy/release.sh qa $TAG"
