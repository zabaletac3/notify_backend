name: deploy-prod
# Al crear una etiqueta v* (p. ej. v1.2.0): se despliega en producción la imagen del commit etiquetado.
# Si ese commit ya tiene imagen (se probó en QA con el mismo sha) NO se recompila: se reutiliza y solo se
# añade la etiqueta de versión. Con merges "squash" el sha de main es nuevo, así que se construye una vez.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reutilizar o construir
        id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if docker buildx imagetools inspect "$IMAGE:$SHA_TAG" >/dev/null 2>&1; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME}" "$IMAGE:$SHA_TAG"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.reuse.outputs.built == 'true'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
  deploy:
    needs: image
    runs-on: ubuntu-latest
    # El entorno `production` debe exigir aprobación manual (Settings → Environments → Required reviewers).
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Desplegar en producción
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "etiqueta de versión no válida: $TAG"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id; chmod 600 ~/.ssh/id
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH=(ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST")
          tar -C deploy -cz . | "${SSH[@]}" 'rm -rf /opt/apunte/deploy.new && mkdir -p /opt/apunte/deploy.new && tar -xz -C /opt/apunte/deploy.new && rm -rf /opt/apunte/deploy && mv /opt/apunte/deploy.new /opt/apunte/deploy'
          "${SSH[@]}" "/opt/apunte/deploy/release.sh prod $TAG"
